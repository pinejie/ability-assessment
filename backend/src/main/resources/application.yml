server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ability-assessment

  # 本地敏感配置（数据库账号、integration.master-key、jwt.secret），文件已 gitignore，不提交
  config:
    import: "optional:file:./config/secret.yml"

  profiles:
    active: dev

  # 账号口令来自 config/secret.yml（开发）或环境变量（部署），二者皆缺失则启动失败
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${OA_DB_URL:jdbc:sqlserver://172.18.28.108:1433;databaseName=ecology;encrypt=false}
    username: ${OA_DB_USER}
    password: ${OA_DB_PASSWORD}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  # 能力结构导入上传：客户那份能力模型 Excel 实测 25 个工作表、130KB 左右。
  # 默认 1MB/10MB 对 25 张表的文件够用，但留余量到 20MB —— 加几张带图片的模板就会超。
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

assess:
  company-id: 1          # 测评数据所属公司（配置表按 company_id 隔离）
  # 评价填写页对外地址：入队时写进 uf_push_msg.pc_url / mobile_url（泛微侧发消息时取用）。
  # 必须是评价人浏览器能打开的地址；同时也是各维度 SSO 回调地址的站点根
  # （uf_assess_dimension_integration.sso_redirect_path 为空时按 /sso/callback 拼）。
  # 部署换域名时改这里，并同步改各维度认证中心里登记的回调地址。
  fill-base-url: https://ca.zhongda.cn
  auth:
    enforced: true       # 业务接口强制登录（false 仅限开发调试回退，禁止公网）
  # 配置超管（OA 登录名 loginid，逗号分隔）：永远视为管理员且不可界面删除，
  # 用于引导第一批管理员、并在管理员表被误清空时保留管理入口。动态管理员走「管理员配置」页（uf_assess_admin 表）。
  bootstrap-admins: 2024188

# 单点登录配置【已迁移到数据库】
# ------------------------------------------------------------
# 原来这里有 oa.sso.* 一段（base-url / client-id / client-secret / redirect-uri）。
# 2026-11-24 起登录配置逐维度存在 uf_assess_dimension_integration 表里，
# 因为不同维度要接不同系统（泛微 / 企微 / 钉钉…），固定一组配置表达不了。
# 迁移脚本：sql/66（建表）、68（把原泛微配置灌进每个维度）。
# 已删除的键不会再被任何代码读取（验收项 A7：删掉这段服务照常启动且能登录）。
#
# 仍属部署级的只有两项，见下：
#   insert：integration.master-key —— 解密维度里存的 client_secret（写在 config/secret.yml）
#           assess.fill-base-url   —— 拼各维度 SSO 回调地址的站点根

integration:
  # 主密钥（32 字符，Base64 或原文）。写在 backend/config/secret.yml 或环境变量
  # INTEGRATION_MASTER_KEY。缺失时登录/推送会报错并提示生成方式，不影响纯业务启动。
  master-key: ${INTEGRATION_MASTER_KEY:}
  # state 有效期（秒）：登录跳转从发起到回调的最长间隔
  state-ttl-seconds: 300
  # 必须在启动时就能解析出实现的协议类型（逗号分隔）。写错或未实现 → 启动即失败，
  # 而不是等到某个用户点登录才 500。
  # weaver = 泛微 e-cology（现有三个维度在用）；ticket = 三方票据模式（规范 20 号文档）；
  # oauth2 = 标准 OAuth2/OIDC 授权码模式（RFC 6749），接非泛微的通用 OAuth2 系统靠它，
  # 加一行维度配置即可，不需要再写适配器。后两者已实现但还没有维度配成它们 ——
  # 列在这里是为了「配了却没实现」在启动时就能发现。
  provider-types-in-use: weaver,ticket,oauth2

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long}
  expiration: 7200  # 2小时（秒）

# 能力结构导入（sql/55 会话表 + POI 读表 + 模型认结构）
pa:
  import:
    ai:
      # 网关凭证走环境变量，仓库零明文；与 hr-report 共用同一份凭证（同一台机器同一个网关）
      # 缺配置时服务照常启动，只在真要调模型时报错并由前端降级到手工映射
      base-url: ${ANTHROPIC_BASE_URL:}
      api-key: ${ANTHROPIC_AUTH_TOKEN:}
      model: ${ANTHROPIC_MODEL:}
      # 实测单次调用 18~25 秒，留足余量
      timeout-seconds: ${PA_IMPORT_AI_TIMEOUT:120}
      # 推理模型的思考过程也计入输出额度：给 2000 会输出空串（实测 2026-11-21）
      max-tokens: ${PA_IMPORT_AI_MAX_TOKENS:16384}
      max-rounds: 10
      session-ttl-minutes: 30
      enabled: true

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: INFO
    com.company.ability: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
