spring:
  datasource:
    # NON_KEYWORDS=YEAR：uf_assess_period.year 与生产列名对齐，H2 2.x 默认把 YEAR 当保留字
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql

assess:
  auth:
    # 测试环境不配置 oa.sso.*，关闭强校验让 SsoConfigValidator 跳过（业务用例不依赖登录）
    enforced: false
  # 测试用配置超管（AdminServiceTest / DimensionContextFilter 相关用例依赖）
  bootstrap-admins: boot-admin1,boot-admin2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: test-secret-key-for-testing-purposes-only
  expiration: 7200
