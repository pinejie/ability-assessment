server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ability-assessment

  # 本地敏感配置（数据库账号、oa.sso.client-secret、jwt.secret），文件已 gitignore，不提交
  config:
    import: "optional:file:./config/secret.yml"

  profiles:
    active: dev

  # 账号口令来自 config/secret.yml（开发）或环境变量（部署），二者皆缺失则启动失败
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: ${OA_DB_URL:jdbc:sqlserver://172.18.28.108:1433;databaseName=ecology;encrypt=false}
    username: ${OA_DB_USER}
    password: ${OA_DB_PASSWORD}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

assess:
  company-id: 1          # 测评数据所属公司（配置表按 company_id 隔离）
  auth:
    enforced: true       # 业务接口强制登录（false 仅限开发调试回退，禁止公网）
  # 配置超管（OA 登录名 loginid，逗号分隔）：永远视为管理员且不可界面删除，
  # 用于引导第一批管理员、并在管理员表被误清空时保留管理入口。动态管理员走「管理员配置」页（uf_assess_admin 表）。
  bootstrap-admins: 2024188

# 泛微 OAuth2 单点登录（契约见《异构系统接入OAuth2认证开发说明》v4.0）
oa:
  sso:
    base-url: http://xcx.zhongda.cn:8080
    client-id: 1feab8b2-bd67-42da-8a31-2dce003fc73a   # 泛微注册应用 CBA（weaver_sso_app.id=5）
    # client-secret 由 backend/config/secret.yml 提供
    redirect-uri: http://172.18.28.206:3000/sso/callback   # 开发环境=本机前端；正式部署需同步改泛微注册
    connect-timeout: 5000
    read-timeout: 10000
    state-ttl-seconds: 300

jwt:
  secret: ${JWT_SECRET:your-secret-key-must-be-at-least-32-characters-long}
  expiration: 7200  # 2小时（秒）

# 智能导入二期（AI 会话桥 + 交付稿）。敏感项 agent.zdcode-app-token / agent.internal-token
# 由 backend/config/secret.yml 提供（缺 internal-token 时 /agent/draft 一律 401）。
agent:
  enabled: true
  zdcode-base-url: http://127.0.0.1:8000
  workspace-path: /home/wgd/ws/cp
  ws-public-url: ws://172.18.28.206:8000   # 浏览器直连 zd-code 的 WS 入口（同 IP 跨端口 = 同站，cookie 可携带）
  draft-idle-minutes: 30
  draft-max-hours: 2

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    root: INFO
    com.company.ability: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
